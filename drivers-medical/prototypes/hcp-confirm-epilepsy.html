<script>
/* ================================================================
   HCP confirm-first prototype: epilepsy (Drivers Medical)

   A throwaway conversation piece for DVLA's doctors. The model:
   ask the driver first, ask a healthcare professional to check
   rather than to tell, and ask for a full report only when the
   risk calls for it. Every screen should show why a question is,
   or isn't, being asked of the healthcare professional.

   The question sort and triggers below are a DRAFT, read from
   epilepsy operating instructions dated 2017 and November 2022
   that may not be current. Not clinically reviewed. Never present
   them as approved policy.

   Hash router, one in-memory state object, no localStorage.
   ================================================================ */

/* === FICTIONAL DATA. Invented, belongs to nobody. === */
const SERVICE_NAME = 'Check medical information for DVLA';
const STAFF_NAME = 'DVLA casework (staff view)';
// Fixed "today" so the 6 and 12 month rules give the same answer in every workshop.
const TODAY = '2026-11-27';
const PATIENT = { name:'Morgan Ellery', dob:'14 June 1987' };
const REQUEST = { reference:'DM-6204-1187', sent:'20 November 2026', practice:'Elmwood Surgery', inbox:'elmwood.admin@example.com' };
const HCP = { name:'Dr Priya Ansell', role:'GP', email:'priya.ansell@example.com' };

/* The driver's declaration (step 1). Same in all three scenarios: what
   changes between scenarios is what the practice record shows.
   category: driverTells | hcpConfirms | hcpProvides | judgement */
const DECLARATION = [
  { id:'c-diagnosis', topic:'Diagnosis', category:'hcpConfirms',
    question:'What condition have you been told you have?',
    hcpQuestion:'Is it correct that your patient’s diagnosis is epilepsy?',
    driverAnswer:'Epilepsy', correction:'text',
    correctionLabel:'What diagnosis do your records show?',
    correctionHint:'For example, a first unprovoked seizure or a provoked seizure.',
    why:'We ask a clinician to confirm the diagnosis because it decides which rules apply to your patient.' },
  { id:'d-history', topic:'Number of seizures', category:'driverTells',
    question:'Have you had a seizure, and was it a first seizure or more than one?',
    hcpQuestion:'Is it correct that your patient has had more than one seizure?',
    driverAnswer:'Yes, more than one seizure', driverValue:'more', correction:'text',
    correctionLabel:'What do your records show?',
    why:'Your patient told us this. We only need you to check it against your records.' },
  { id:'d-first', topic:'First seizure', category:'driverTells',
    question:'When was your first seizure?',
    hcpQuestion:'Is it correct that your patient’s first seizure was on 12 March 2019?',
    driverAnswer:'12 March 2019', driverDate:'2019-03-12', correction:'date',
    correctionLabel:'What date do your records show for the first seizure?',
    why:'Your patient told us this date. We only need you to check it against your records.' },
  { id:'d-last', topic:'Most recent seizure', category:'driverTells',
    question:'When was your most recent seizure?',
    hcpQuestion:'Is it correct that your patient’s most recent seizure was on 4 February 2025?',
    driverAnswer:'4 February 2025', driverDate:'2025-02-04', correction:'date',
    correctionLabel:'What date do your records show for the most recent seizure?',
    why:'Your patient told us this date. It matters most of all the dates, so please check it against the latest letters in your records.' },
  { id:'d-five', topic:'Seizures in the last 5 years', category:'driverTells',
    question:'Have you had 2 or more seizures in the last 5 years?',
    hcpQuestion:'Is it correct that your patient has had 2 or more seizures in the last 5 years?',
    driverAnswer:'Yes', correction:'text',
    correctionLabel:'What do your records show?',
    why:'Your patient told us this. We only need you to check it against your records.' },
  { id:'d-awake', topic:'Awake or asleep', category:'driverTells',
    question:'Do your seizures happen while you’re awake, asleep, or both?',
    hcpQuestion:'Is it correct that your patient’s seizures happen only while they’re awake?',
    driverAnswer:'Only while awake', driverValue:'awake', correction:'text',
    correctionLabel:'What do your records show?',
    correctionHint:'For example, only while asleep, or both awake and asleep.',
    why:'Your patient told us this. We only need you to check it against your records.' },
  { id:'d-medication', topic:'Change to medication', category:'hcpConfirms',
    question:'Has a doctor changed or stopped your epilepsy medication? When?',
    hcpQuestion:'Is it correct that a doctor reduced your patient’s epilepsy medication on 10 March 2025?',
    driverAnswer:'Yes. A doctor reduced the dose on 10 March 2025.', correction:'text',
    correctionLabel:'What do your records show about the change, and its date?',
    why:'We ask a clinician to confirm that a doctor directed this change, and when. A change made without medical advice is treated differently.' },
  { id:'c-alcohol', topic:'Alcohol or drugs', category:'hcpConfirms',
    question:'Were any of your seizures related to alcohol or drugs?',
    hcpQuestion:'Is it correct that none of your patient’s seizures were related to alcohol or drugs?',
    driverAnswer:'No, not related to alcohol or drugs', correction:'text',
    correctionLabel:'What do your records show?',
    why:'We ask a clinician to confirm this because alcohol or drug use would change which rules apply.' },
  { id:'d-lastseen', topic:'Last appointment', category:'driverTells',
    question:'Who did you last see about your epilepsy, and when?',
    hcpQuestion:'Is it correct that your patient last saw a neurologist about their epilepsy on 2 October 2026?',
    driverAnswer:'Dr Tomas Reyes, neurologist at Northgate Hospital, on 2 October 2026', correction:'text',
    correctionLabel:'What do your records show?',
    why:'Your patient told us this. We only need you to check it against your records. It tells us whose letters to look for.' }
];

/* Clinical judgement items. Asked once, as a single question. A rule never
   decides these: any of them sends the case to a DVLA doctor. */
const SCREENING = [
  { id:'awareness', label:'Seizures that affect consciousness, awareness or the ability to act' },
  { id:'provoked',  label:'A provoked seizure in the last 5 years' },
  { id:'headinjury',label:'A seizure linked to a head injury or electroconvulsive therapy (ECT)' }
];

/* Triggers for moving up a step. DRAFT. */
const TRIGGERS = [
  { id:'t1', rule:'Driver declares a seizure in the last 12 months that isn’t sleep-only',
    effect:'decideOnDeclaration', result:'Decide on the declaration. No request to a healthcare professional. This already happens today.' },
  { id:'t2', rule:'Driver declares a first unprovoked seizure in the last 6 months',
    effect:'decideOnDeclaration', result:'Decide on the declaration. No request to a healthcare professional.' },
  { id:'t3', rule:'The healthcare professional’s dates or diagnosis contradict the driver’s',
    effect:'returnToCaseworker', result:'The healthcare professional gives the correct detail. The case goes back to the caseworker.' },
  { id:'t4', rule:'Seizures affect consciousness, awareness or the ability to act',
    effect:'clinicalJudgement', result:'The healthcare professional answers the questions only they can answer. The case goes to a DVLA doctor.' },
  { id:'t5', rule:'A provoked seizure, or a seizure linked to a head injury or ECT',
    effect:'clinicalJudgement', result:'The healthcare professional answers the questions only they can answer. The case goes to a DVLA doctor.' }
];

/* Step 3. Shown only when a linked trigger fires. */
const EXTRA_QUESTIONS = [
  { id:'eq-awareness', triggers:['t4'], type:'text',
    question:'How do your patient’s seizures affect their consciousness, awareness or ability to act?',
    hint:'Describe what happens during a seizure, as your records show it.',
    why:'You told us your patient’s seizures affect their awareness. A DVLA doctor will decide what that means for driving, so they need your description rather than a yes or no.' },
  { id:'eq-risk', triggers:['t4','t5'], type:'yesno',

/* === STATE. In memory only: a reload resets the prototype. === */
let state;
function resetState(scenario){
  const showNotes = state ? state.showNotes : false;
  const s = SCENARIOS[scenario] ? scenario : 1;
  state = {
    showNotes,
    scenario: s,
    signedIn: false,
    patient: { name:PATIENT.name, dob:PATIENT.dob },
    declaration: DECLARATION.map(d => ({ id:d.id, question:d.question, driverAnswer:d.driverAnswer, category:d.category })),
    hcpResponse: [],            // { declarationId, confirmed, correction, respondedAt }
    screening: null,            // null until answered; then an array of SCREENING ids (empty = none of these)
    triggers: TRIGGERS.map(t => ({ id:t.id, rule:t.rule, fired:false, effect:t.effect })),
    extraQuestions: EXTRA_QUESTIONS.map(q => ({ id:q.id, question:q.question, why:q.why, answer:'', detail:'' })),
    declared: false,
    submitted: false,
    caseOutcome: { route:'awaitingHcp', preEvidenceView:'', sampledForVerification: SCENARIOS[s].sampled },
    changing: false,
    errors: null,
    form: {}
  };
  evaluate();
}

/* === HELPERS === */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function go(screen){ if(location.hash === '#/'+screen){ route(); } else { location.hash = '#/'+screen; } }
function note(title, body){
  if(!state.showNotes) return '';
  return '<div class="design-note"><strong>Design note: '+esc(title)+'</strong>'+body+'</div>';
}
// Every healthcare professional screen links to the rules page from its note.
function hcpNote(title, body){
  return note(title, body + '<p><a href="#/rules">How this form was built: the draft question sort</a></p>');
}
function openQ(who, q){ return '<p><strong style="display:inline;color:inherit;text-transform:none;letter-spacing:0;font-size:16px">Open question ('+esc(who)+'):</strong> '+q+'</p>'; }
function toggleNotes(){ state.showNotes = !state.showNotes; route(); }
function warn(){
  return '<div class="prototype-warning"><strong>⚠ Fictional prototype</strong>'
    +'This is a fictional prototype. It is not a real GOV.UK service and all personal details shown are invented.</div>';
}
function draftWarning(text){
  return '<div class="govuk-warning-text"><span class="govuk-warning-text__icon" aria-hidden="true">!</span>'
    +'<strong class="govuk-warning-text__text"><span class="govuk-visually-hidden">Warning</span>'+text+'</strong></div>';
}
function tag(text, colour){ return '<strong class="govuk-tag govuk-tag--'+colour+'">'+esc(text)+'</strong>'; }

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function formatDate(iso){ if(!iso) return ''; const [y,m,d] = iso.split('-').map(Number); return d+' '+MONTHS[m-1]+' '+y; }
function monthsBetween(isoA, isoB){
  const a = new Date(isoA+'T00:00:00'), b = new Date(isoB+'T00:00:00');
  let m = (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());
  if(b.getDate() < a.getDate()) m--;
  return m;
}
function withinMonths(iso, n){ return !!iso && monthsBetween(iso, TODAY) < n; }
function nowStamp(){
  const n = new Date();
  return formatDate(TODAY)+', '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
}

function def(id){ return DECLARATION.find(d => d.id === id); }
function resp(id){ return state.hcpResponse.find(r => r.declarationId === id); }
function trig(id){ return state.triggers.find(t => t.id === id); }
function extraDef(id){ return EXTRA_QUESTIONS.find(q => q.id === id); }
function extra(id){ return state.extraQuestions.find(q => q.id === id); }
function correctionText(d, r){
  if(!r || r.confirmed !== false) return '';
  return d.correction === 'date' ? formatDate(r.correction) : r.correction;
}

/* === RULES. Recomputed from state after every answer. DRAFT. === */
const DATE_OR_DIAGNOSIS = ['c-diagnosis','d-first','d-last'];
function evaluate(){
  const last = def('d-last').driverDate;
  const first = def('d-first').driverDate;
  const awake = def('d-awake').driverValue;
  const history = def('d-history').driverValue;
  const sc = state.screening || [];
  trig('t1').fired = withinMonths(last, 12) && awake !== 'asleep';
  trig('t2').fired = history === 'first' && withinMonths(first, 6);
  trig('t3').fired = DATE_OR_DIAGNOSIS.some(id => { const r = resp(id); return r && r.confirmed === false; });
  trig('t4').fired = sc.includes('awareness');
  trig('t5').fired = sc.includes('provoked') || sc.includes('headinjury');
  state.caseOutcome.route = routeFor(state.triggers, gapFlags().length > 0);
}
// Flags on items that no draft rule covers. The draft is silent on these.
function gapFlags(){
  return state.hcpResponse.filter(r => r.confirmed === false && !DATE_OR_DIAGNOSIS.includes(r.declarationId));
}
function routeFor(triggers, hasGap){
  const f = id => triggers.find(t => t.id === id).fired;
  if(f('t1') || f('t2')) return 'decideOnDeclaration';
  if(!state.submitted) return 'awaitingHcp';
  if(f('t4') || f('t5')) return 'clinicalJudgement';
  if(f('t3') || hasGap) return 'returnToCaseworker';
  return 'issue';
}
function extraShown(q){ return extraDef(q.id).triggers.some(id => trig(id).fired); }
function shownExtras(){ return state.extraQuestions.filter(extraShown); }

/* === JOURNEY ORDER === */
function flow(){
  return DECLARATION.map(d => 'confirm/'+d.id)
    .concat(['screening'])
    .concat(shownExtras().map(q => 'extra/'+q.id))
    .concat(['check']);
}
function nextAfter(key){
  if(state.changing){
    // After changing the screening answer, any newly needed questions come before the check page.
    const missing = shownExtras().find(q => !q.answer);
    if(missing) return 'extra/'+missing.id;
    state.changing = false;
    return 'check';
  }
  const f = flow(); const i = f.indexOf(key);
  return f[i+1] || 'check';
}
function backFrom(key){
  if(state.changing) return 'check';
  const f = flow(); const i = f.indexOf(key);
  return i > 0 ? f[i-1] : 'patient';
}
function changeTo(key){ state.changing = true; state.errors = null; go(key); }
function backLink(key){ return '<a href="#/'+backFrom(key)+'" class="govuk-back-link">Back</a>'; }

/* === ERRORS === */
function errorSummary(){
  if(!state.errors || !state.errors.length) return '';
  return '<div class="govuk-error-summary" role="alert" tabindex="-1" id="error-summary"><h2>There is a problem</h2><ul>'
    + state.errors.map(e => '<li><a href="#" onclick="focusField(\''+e.field+'\');return false;">'+esc(e.text)+'</a></li>').join('')
    + '</ul></div>';
}
function focusField(id){ const el = document.getElementById(id); if(el){ el.focus(); el.scrollIntoView({block:'center'}); } }
function errFor(field){ return state.errors && state.errors.find(e => e.field === field || e.group === field); }
function errorMsg(field){ const e = errFor(field); return e ? '<p class="govuk-error-message"><span class="govuk-visually-hidden">Error:</span> '+esc(e.text)+'</p>' : ''; }
function groupClass(field){ return 'govuk-form-group'+(errFor(field)?' govuk-form-group--error':''); }

/* ---------------------------------------------------------------- */
/* INDEX                                                             */
/* ---------------------------------------------------------------- */
function startScenario(n){ resetState(n); go('arrival'); }

function screenGroups(){
  return [
    { title:'Healthcare professional', items:[
      ['arrival','The request arrives in the practice inbox'],
      ['sign-in','Sign in'],
      ['access','Confirm the request and practice'],
      ['patient','Patient and request']]
      .concat(DECLARATION.map((d,i) => ['confirm/'+d.id, 'What your patient told us, '+(i+1)+' of '+DECLARATION.length+': '+d.topic]))
      .concat([['screening','Does your patient have any of these?']])
      .concat(EXTRA_QUESTIONS.map(q => ['extra/'+q.id, 'Question only you can answer: '+q.question+' (only if a trigger fires)']))
      .concat([['check','Check your answers'],['declaration','Declaration'],['confirmation','Confirmation']]) },
    { title:'DVLA staff', items:[['case','Case view'],['verification','Verification']] },
    { title:'How it was built', items:[['rules','The rules: draft question sort and triggers']] }
  ];
}

function renderAllScreens(){
  let scen = '';
  Object.keys(SCENARIOS).forEach(n => {
    const s = SCENARIOS[n];
    scen += '<li><a href="#" onclick="startScenario('+n+');return false;">Scenario '+n+': '+esc(s.title)+'</a><p>'+esc(s.summary)+'</p></li>';
  });
  let groups = '';
  screenGroups().forEach(g => {
    groups += '<h2 class="govuk-heading-m">'+esc(g.title)+'</h2><ul class="govuk-list govuk-list--bullet">'
      + g.items.map(([k,t]) => '<li><a href="#/'+k+'">'+esc(t)+'</a></li>').join('') + '</ul>';
  });
  return '<h1 class="govuk-heading-l">All screens</h1>'
    + '<p class="govuk-body-l">A conversation piece about asking healthcare professionals to check what a driver told us, rather than to write a report.</p>'
    + '<p class="govuk-body">The driver declares first. A healthcare professional confirms or flags each answer against their records. They answer extra questions only when a defined risk indicator is present. DVLA checks a random sample of declarations.</p>'
    + draftWarning('The question sort and triggers are a draft from operating instructions that may be out of date. They have not been clinically reviewed and are not approved policy.')
    + '<h2 class="govuk-heading-m">Start a scenario</h2>'
    + '<p class="govuk-body">Each scenario starts from the same driver declaration. What changes is what the practice record shows. Starting a scenario resets everything.</p>'
    + '<ul class="ref-index">'+scen+'</ul>'
    + '<p class="govuk-body">Current scenario: <strong>'+state.scenario+'. '+esc(SCENARIOS[state.scenario].title)+'</strong></p>'
    + groups
    + '<button class="govuk-button govuk-button--secondary" onclick="resetState(state.scenario);route()">Reset prototype</button>';
}

/* ---------------------------------------------------------------- */
/* RULES PAGE                                                        */
/* ---------------------------------------------------------------- */
function renderRules(){
  const row = cells => '<tr>'+cells.map(c => '<td>'+c+'</td>').join('')+'</tr>';
  const head = cells => '<thead><tr>'+cells.map(c => '<th scope="col">'+c+'</th>').join('')+'</tr></thead>';
  const triggerFor = id => {
    if(DATE_OR_DIAGNOSIS.includes(id)) return 'If flagged: the healthcare professional gives the correct detail and the case returns to the caseworker (t3)';
    return 'If flagged: <em>no draft rule</em>. The prototype returns the case to the caseworker.';
  };
  const whoFor = cat => ({ driverTells:'Driver, then the healthcare professional checks', hcpConfirms:'Driver, then the healthcare professional confirms', hcpProvides:'Healthcare professional', judgement:'DVLA doctor' })[cat];

  let sortRows = '';
  ['driverTells','hcpConfirms'].forEach(cat => {
    DECLARATION.filter(d => d.category === cat).forEach(d => {
      sortRows += row(['<strong>'+esc(d.question)+'</strong>', esc(CATEGORIES[cat]), esc(whoFor(cat)), esc(d.why), triggerFor(d.id)]);
    });
  });
  EXTRA_QUESTIONS.forEach(q => {
    sortRows += row(['<strong>'+esc(q.question)+'</strong>', esc(CATEGORIES.hcpProvides), esc(whoFor('hcpProvides')), esc(q.why),
      'Asked only when '+q.triggers.join(' or ')+' fires']);
  });
  SCREENING.forEach(s => {
    sortRows += row(['<strong>'+esc(s.label)+'</strong>', esc(CATEGORIES.judgement), 'The healthcare professional says whether it applies. A DVLA doctor decides what it means.',
      'Never answered by a rule.', 'Present: the case goes to a DVLA doctor ('+(s.id==='awareness'?'t4':'t5')+')']);
  });

  const trigRows = TRIGGERS.map(t => row(['<strong>'+t.id+'</strong>', esc(t.rule), esc(t.result)])).join('');

  return '<a href="#/all-screens" class="govuk-back-link">All screens</a>'
    + '<span class="govuk-caption">Draft for clinical challenge</span>'
    + '<h1 class="govuk-heading-xl">How this form was built</h1>'
    + draftWarning('Draft. This is a first reading of the epilepsy operating instructions dated 2017 and November 2022, which may not be current. It has not been clinically reviewed and is not approved policy.')
    + '<p class="govuk-body">The model asks the driver first, asks a healthcare professional to check rather than to tell, and asks for a full report only when the risk calls for it. This page sorts each question by who answers it, and says what moves it up a step.</p>'
    + '<h2 class="govuk-heading-l">The four steps</h2>'
    + '<table class="govuk-table">'+head(['Step','Who','What','When'])+'<tbody>'
    + row(['1. Declare','Driver','Tells us about their condition. Answers are held as data.','Always'])
    + row(['2. Confirm','Healthcare professional','Reviews the driver’s answers and confirms or flags each one','Where the declaration shows an exception, a concern or a contradiction'])
    + row(['3. Report or examine','Healthcare professional','Answers the questions only a clinician can answer','Where a defined risk indicator is present'])
    + row(['Verify','DVLA','Checks a random sample of declarations','Always (staff view only)'])
    + '</tbody></table>'
    + '<h2 class="govuk-heading-l">The question sort</h2>'
    + '<div style="overflow-x:auto"><table class="govuk-table">'+head(['Question','Category','Who answers','Why','What moves it up a step'])+'<tbody>'+sortRows+'</tbody></table></div>'
    + '<h2 class="govuk-heading-l">Triggers for moving up a step</h2>'
    + '<table class="govuk-table">'+head(['','Trigger','What happens'])+'<tbody>'+trigRows+'</tbody></table>'
    + '<h2 class="govuk-heading-l">Gaps found while building this</h2>'
    + '<ul class="govuk-list govuk-list--bullet">'
    + '<li>Nothing in the draft says what moves a case from step 1 to step 2. This prototype assumes the declaration has an exception worth checking, such as a medication change.</li>'
    + '<li>The draft only says what happens when dates or the diagnosis are contradicted. A flag on any other answer, such as awake or asleep, has no rule. The prototype sends it back to the caseworker.</li>'

function revealCorrection(){

function saveConfirm(e, id){
  e.preventDefault();
  const d = def(id);
  const form = e.target;
  const picked = form.querySelector('input[name="answer"]:checked');
  const errors = [];
  const f = { answer: picked ? picked.value : '' };
  let correction = '';
  if(!picked){
    errors.push({ field:'answer-yes', text:'Select whether this is correct' });
  } else if(picked.value === 'no'){
    if(d.correction === 'date'){
      f.day = form.day.value.trim(); f.month = form.month.value.trim(); f.year = form.year.value.trim();
      if(!f.day && !f.month && !f.year){
        errors.push({ field:'correction-day', text:'Enter the date your records show' });
      } else {
        const dd = Number(f.day), mm = Number(f.month), yy = Number(f.year);
        const dt = new Date(yy, mm-1, dd);
        const real = /^\d{1,2}$/.test(f.day) && /^\d{1,2}$/.test(f.month) && /^\d{4}$/.test(f.year) && dt.getFullYear()===yy && dt.getMonth()===mm-1 && dt.getDate()===dd;
        if(!real){
          errors.push({ field:'correction-day', text:'Date must be a real date' });
        } else {
          correction = yy+'-'+String(mm).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
          if(correction > TODAY) errors.push({ field:'correction-day', text:'Date must be today or in the past' });
        }
      }
    } else {
      f.correction = form.correction.value;
      correction = f.correction.trim();
      if(!correction) errors.push({ field:'correction', text:'Enter what your records show' });
    }
  }
  if(errors.length){ state.errors = errors; state.form = f; route(); return; }
  state.hcpResponse = state.hcpResponse.filter(r => r.declarationId !== id);
  state.hcpResponse.push({ declarationId:id, confirmed: picked.value === 'yes', correction: picked.value === 'yes' ? '' : correction, respondedAt: nowStamp() });
  evaluate();
  go(nextAfter('confirm/'+id));
}

function saveScreening(e){

    extras += summaryRow(esc(q.question), value, change('extra/'+a.id, 'your answer to: '+q.question.toLowerCase()));
  });
  return backLink('check')
    + '<h1 class="govuk-heading-l">Check your answers before sending them</h1>'
    + '<h2 class="govuk-heading-m">What your patient told us</h2>'
    + '<dl class="govuk-summary-list">'+told+'</dl>'
    + '<h2 class="govuk-heading-m">Anything a DVLA doctor needs to look at</h2>'
    + '<dl class="govuk-summary-list">'+summaryRow('Your patient’s records show', scValue, change('screening','what your patient’s records show'))+'</dl>'
    + (extras ? '<h2 class="govuk-heading-m">Questions only you can answer</h2><dl class="govuk-summary-list">'+extras+'</dl>' : '')
    + '<button class="govuk-button" onclick="state.changing=false;go(\'declaration\')">Continue</button>'
    + hcpNote('Flags stand out on the way out',
      '<p>A flagged answer shows both versions, so the clinician sees exactly what they are disagreeing with before they send it.</p>');
}

/* Declaration */
function missingAnswers(){
  const m = [];
  DECLARATION.forEach(d => { if(!resp(d.id)) m.push({ key:'confirm/'+d.id, text:'Tell us whether “'+d.topic.toLowerCase()+'” is correct' }); });
  if(state.screening == null) m.push({ key:'screening', text:'Tell us whether your patient’s records show anything a DVLA doctor needs to look at' });
  shownExtras().forEach(a => { if(!a.answer) m.push({ key:'extra/'+a.id, text:'Answer: '+extraDef(a.id).question }); });
  return m;
}
function renderDeclaration(){
  const missing = state.form.missing ? missingAnswers() : [];
  const summary = missing.length ? '<div class="govuk-error-summary" role="alert" tabindex="-1" id="error-summary"><h2>There is a problem</h2><ul>'
    + missing.map(m => '<li><a href="#/'+m.key+'" onclick="changeTo(\''+m.key+'\');return false;">'+esc(m.text)+'</a></li>').join('') + '</ul></div>' : '';
  return '<a href="#/check" class="govuk-back-link">Back</a>'
    + summary
    + '<h1 class="govuk-heading-l">Declaration</h1>'
    + '<p class="govuk-body">By sending this, you confirm that the information you’ve given is accurate, from your patient’s records.</p>'
    + '<p class="govuk-body">Signed in as '+esc(HCP.name)+', '+esc(HCP.role)+', '+esc(REQUEST.practice)+'.</p>'
    + '<button class="govuk-button" onclick="send()">Confirm and send</button>'
    + hcpNote('What the clinician is putting their name to',
      '<p>They are confirming that the patient’s answers match the records, not making a fitness-to-drive assessment. The wording has to make that difference plain, or clinicians will treat a confirmation as a report and charge, check and delay accordingly.</p>'
      + openQ('liability','does confirming a patient’s answers carry different professional responsibility from writing a report?'));
}
function send(){
  if(missingAnswers().length){ state.form = { missing:true }; route(); return; }
  state.submitted = true;
  state.declared = true;
  evaluate();
  go('confirmation');
}

/* Confirmation */
function renderConfirmation(){
  const toDoctor = shownExtras().length > 0;
  return '<div class="govuk-panel govuk-panel--confirmation"><h1 class="govuk-panel__title">Information sent to DVLA</h1>'
    + '<div class="govuk-panel__body">Reference<br><strong>'+esc(REQUEST.reference)+'</strong></div></div>'
    + '<h2 class="govuk-heading-m">What happens next</h2>'
    + (toDoctor
      ? '<p class="govuk-body">A DVLA doctor will look at your answers alongside what '+esc(state.patient.name)+' told us. If they need more information, we’ll send a new request to your practice inbox.</p>'
      : '<p class="govuk-body">We’ll use your answers alongside what '+esc(state.patient.name)+' told us. If anything you’ve told us needs a closer look, we’ll send a new request to your practice inbox.</p>')
    + '<p class="govuk-body">We’ll write to your patient with our decision about their driving licence. You do not need to do anything else.</p>'
    + '<h2 class="govuk-heading-m">Payment</h2>'
    + '<p class="govuk-body">We’ll pay your practice for this in the same way we pay for medical reports today.</p>'
    + hcpNote('Done, and paid as now',
      '<p>The clinician needs to know two things: that they are finished, and that the practice will be paid. Neither should be a reason to phone.</p>'
      + openQ('fee','is a confirmation paid at the same rate as a report from records (£50 today)? The screen says “the same way”, not the same amount, until that is decided.')
      + '<p><a href="#/case">See what DVLA staff see for this case</a></p>');
}

Object.assign(RENDER, {
  'arrival':        { title:'New request from DVLA', fn:renderArrival },
  'sign-in':        { title:'Sign in', fn:renderSignIn },
  'access':         { title:'Check this request is for your practice', fn:renderAccess },
  'wrong-practice': { title:'Request not for your practice', fn:renderWrongPractice },
  'patient':        { title:'Check this is your patient', fn:renderPatient },
  'not-patient':    { title:'Not your patient', fn:renderNotPatient },
  'confirm/*':      { title:id => (def(id) ? def(id).hcpQuestion : 'All screens'), fn:renderConfirm },
  'screening':      { title:'Do your patient’s records show any of these?', fn:renderScreening },
  'extra/*':        { title:id => (extraDef(id) ? extraDef(id).question : 'All screens'), fn:renderExtra },
  'check':          { title:'Check your answers', fn:renderCheck },
  'declaration':    { title:'Declaration', fn:renderDeclaration },
  'confirmation':   { title:'Information sent to DVLA', fn:renderConfirmation }
});

/* ---------------------------------------------------------------- */
/* DVLA STAFF SCREENS. A neutral view, not styled as the real        */
/* case management system. Labels here are prototype labels.        */
/* ---------------------------------------------------------------- */
const PRE_EVIDENCE = {
  issue:{ label:'Issue a licence', route:'issue' },
  refuse:{ label:'Refuse or revoke the licence', route:null },
  report:{ label:'Ask a healthcare professional for a full report', route:null },
  doctor:{ label:'Refer to a DVLA doctor', route:'clinicalJudgement' },
  skipped:{ label:'Not recorded (skipped in the workshop)', route:null }
};

function savePreEvidence(e){
  e.preventDefault();
  const picked = e.target.querySelector('input[name="pre"]:checked');
  if(!picked){ state.errors = [{ field:'pre-issue', text:'Select what you would decide without this evidence' }]; route(); return; }
  state.caseOutcome.preEvidenceView = picked.value;
  route();
}
function skipPreEvidence(){ state.caseOutcome.preEvidenceView = 'skipped'; route(); }

function renderCase(){
  const co = state.caseOutcome;
  const head = '<span class="govuk-caption">Case '+esc(REQUEST.reference)+' · epilepsy</span>'
    + '<h1 class="govuk-heading-l">'+esc(state.patient.name)+', born '+esc(state.patient.dob)+'</h1>';

  const staffNote = note('The gateway metric',
    '<p>“What would you decide without this evidence?” is asked before the caseworker sees the healthcare professional’s response. Asked afterwards, the answer is anchored by what they’ve just read and the measure is worthless.</p>'
    +'<p>Across many cases, how often the pre-evidence view matches the final outcome tells us which evidence requests change decisions, and which only add weeks to the wait. That is the case for asking less.</p>'
    + openQ('Keya, policy','does deciding on the declaration plus a confirmation need any change to policy or guidance?'));

  // Step 1: the caseworker records a view from the declaration alone.
  if(!co.preEvidenceView){
    const opt = k => '<div class="govuk-radios__item"><input class="govuk-radios__input" id="pre-'+k+'" name="pre" type="radio" value="'+k+'"><label class="govuk-label govuk-radios__label" for="pre-'+k+'">'+esc(PRE_EVIDENCE[k].label)+'</label></div>';
    const decl = DECLARATION.map(d => summaryRow(esc(d.topic), esc(d.driverAnswer))).join('');
    return head + errorSummary()
      + '<h2 class="govuk-heading-m">What the driver told us</h2>'
      + '<dl class="govuk-summary-list">'+decl+'</dl>'
      + '<form onsubmit="savePreEvidence(event)" novalidate>'
      + '<div class="'+groupClass('pre-issue')+'"><fieldset class="govuk-fieldset" aria-describedby="pre-hint">'
      + '<legend class="govuk-fieldset__legend"><h2 class="govuk-heading-m" style="margin:0">What would you decide without this evidence?</h2></legend>'
      + '<div class="govuk-hint" id="pre-hint">Answer from the driver’s declaration alone. You’ll see the healthcare professional’s response after you save.</div>'
      + errorMsg('pre-issue')
      + '<div class="govuk-radios">'+['issue','refuse','report','doctor'].map(opt).join('')+'</div>'
      + '</fieldset></div>'
      + '<div class="govuk-button-group"><button type="submit" class="govuk-button">Save and show the response</button>'
      + '<a class="govuk-link" href="#" onclick="skipPreEvidence();return false;">Skip this for the workshop</a></div></form>'
      + staffNote;
  }

  // Step 2: the evidence, side by side.
  const routeInfo = ROUTES[co.route];
  const fired = state.triggers.filter(t => t.fired);
  let explain = '';
  if(co.route === 'awaitingHcp'){
    explain = '<p>We sent the request to '+esc(REQUEST.practice)+' on '+esc(REQUEST.sent)+'. There is no reply yet. The case stays here until the healthcare professional replies, and the rules run again when they do.</p>';
  } else {
    explain = fired.length
      ? '<p>Triggers that fired: '+fired.map(t => '<strong>'+t.id+'</strong> ('+esc(t.rule.toLowerCase())+')').join('; ')+'.</p>'
      : '<p>No trigger fired. Every answer was confirmed and nothing needs a doctor’s judgement.</p>';
    if(gapFlags().length) explain += '<p>A flag on '+gapFlags().map(r => esc(def(r.declarationId).topic.toLowerCase())).join(', ')+' has no draft rule. The prototype returns the case to the caseworker.</p>';
    const ifConfirmed = routeFor(state.triggers.map(t => ({ id:t.id, fired: (t.id === 't3') ? false : t.fired })), false);
    if(ifConfirmed !== co.route) explain += '<p>If every answer had been confirmed, the outcome would have been: '+esc(ROUTES[ifConfirmed].label)+'.</p>';
    const last = resp('d-last');
    if(last && last.confirmed === false && withinMonths(last.correction, 12)){
      explain += '<p>Using the healthcare professional’s date ('+esc(formatDate(last.correction))+'), the most recent seizure was within the last 12 months. Had the driver given that date, trigger t1 would have applied and no request would have been sent.</p>';
    }
  }
  const outcome = '<div class="govuk-notification-banner" role="region" aria-labelledby="nb-outcome"><div class="govuk-notification-banner__header"><h2 class="govuk-notification-banner__title" id="nb-outcome">Rule outcome (draft rules)</h2></div>'
    + '<div class="govuk-notification-banner__content"><p class="govuk-notification-banner__heading">'+esc(routeInfo.label)+'</p>'+explain+'</div></div>';

  const th = cells => '<thead><tr>'+cells.map(c => '<th scope="col">'+c+'</th>').join('')+'</tr></thead>';
  let rows = '';
  DECLARATION.forEach(d => {
    const r = resp(d.id);
    let hcp, status;
    if(!r){ hcp = 'No response yet'; status = tag('Waiting','grey'); }
    else if(r.confirmed){ hcp = 'Confirmed'; status = tag('Confirmed','green'); }
    else { hcp = '<strong>Records show: '+esc(correctionText(d, r))+'</strong>'; status = tag('Flagged','red'); }
    rows += '<tr><td><strong>'+esc(d.topic)+'</strong></td><td>'+esc(CATEGORIES[d.category])+'</td><td>'+esc(d.driverAnswer)+'</td><td>'+hcp+(r?'<br><span class="govuk-body-s">'+esc(r.respondedAt)+'</span>':'')+'</td><td>'+status+'</td></tr>';
  });
  const sc = state.screening;
  const scText = sc == null ? 'No response yet' : (sc.length ? sc.map(id => esc(SCREENING.find(s => s.id === id).label)).join('<br>') : 'None of these');
  rows += '<tr><td><strong>Anything needing a doctor’s judgement</strong></td><td>'+esc(CATEGORIES.judgement)+'</td><td>Not asked of the driver</td><td>'+scText+'</td><td>'
    + (sc == null ? tag('Waiting','grey') : sc.length ? tag('Doctor needed','purple') : tag('None','green'))+'</td></tr>';
  shownExtras().forEach(a => {
    const q = extraDef(a.id);
    const val = !a.answer ? 'No response yet' : q.type === 'yesno' ? (a.answer === 'yes' ? 'Yes: '+esc(a.detail) : 'No') : esc(a.answer);
    rows += '<tr><td><strong>'+esc(q.question)+'</strong></td><td>'+esc(CATEGORIES.hcpProvides)+'</td><td>Not asked of the driver</td><td>'+val+'</td><td>'+tag('Provided','blue')+'</td></tr>';
  });

  const trigRows = state.triggers.map(t => '<tr><td><strong>'+t.id+'</strong></td><td>'+esc(t.rule)+'</td><td>'+(t.fired ? tag('Fired','red') : tag('Not fired','grey'))+'</td></tr>').join('');

  const pre = PRE_EVIDENCE[co.preEvidenceView];
  let match = '';
  if(co.preEvidenceView !== 'skipped' && co.route !== 'awaitingHcp'){
    match = pre.route === co.route ? 'The same as the rule outcome' : 'Different from the rule outcome';
  }

  return head + outcome
    + '<h2 class="govuk-heading-m">The driver’s answers and the healthcare professional’s response</h2>'
    + '<div style="overflow-x:auto"><table class="govuk-table">'+th(['Answer','Category (draft)','Driver said','Healthcare professional','Status'])+'<tbody>'+rows+'</tbody></table></div>'
    + '<h2 class="govuk-heading-m">Triggers (draft)</h2>'
    + '<table class="govuk-table">'+th(['','Trigger','This case'])+'<tbody>'+trigRows+'</tbody></table>'
    + '<h2 class="govuk-heading-m">Your view before the evidence</h2>'
    + '<dl class="govuk-summary-list">'
    + summaryRow('Without the evidence you would have', esc(pre.label), '<a class="govuk-link" href="#" onclick="state.caseOutcome.preEvidenceView=\'\';route();return false;">Change<span class="govuk-visually-hidden"> your view before the evidence</span></a>')
    + (match ? summaryRow('Compared with the rule outcome', esc(match)) : '')
    + '</dl>'
    + '<h2 class="govuk-heading-m">Verification</h2>'
    + '<p class="govuk-body">'+(co.sampledForVerification ? 'This case was picked in the random verification sample.' : 'This case was not picked in the random verification sample.')+' <a class="govuk-link" href="#/verification">What verification involves</a></p>'
    + staffNote
    + note('Held as data, compared row by row',
      '<p>The driver’s answer and the clinician’s response sit on the same row, so a contradiction is a visible difference, not something a caseworker spots in a scanned letter. The rule outcome says which rule produced it, so the caseworker can disagree with the rule rather than just the result.</p>');
}

function renderVerification(){
  const co = state.caseOutcome;
  return '<a href="#/case" class="govuk-back-link">Back to the case</a>'
    + '<span class="govuk-caption">Case '+esc(REQUEST.reference)+'</span>'
    + '<h1 class="govuk-heading-l">'+(co.sampledForVerification ? 'This case was picked for verification' : 'This case was not picked for verification')+'</h1>'
    + (co.sampledForVerification
      ? '<p class="govuk-body">Every declaration has the same chance of being picked, whatever the driver told us and whatever the healthcare professional said. Being picked does not hold up the decision.</p>'
        + '<h2 class="govuk-heading-m">What checking involves</h2>'
        + '<ol class="govuk-list govuk-list--number">'
        + '<li>We ask '+esc(REQUEST.practice)+' for the relevant entries from '+esc(state.patient.name)+'’s records: diagnosis, seizure dates, medication changes and the latest specialist letter.</li>'
        + '<li>A caseworker compares them with the driver’s declaration and the healthcare professional’s confirmation, answer by answer.</li>'
        + '<li>We record whether each answer matched. The results tell us whether the declaration and the confirmation can be trusted, and for which questions.</li>'
        + '</ol>'
      : '<p class="govuk-body">The decision rests on the driver’s declaration and the healthcare professional’s confirmation. Every declaration has the same chance of being picked, so a case not being picked says nothing about it.</p>')
    + '<dl class="govuk-summary-list">'
    + summaryRow('Sample size','Not decided (draft)')
    + summaryRow('If a checked answer turns out to be wrong','Not decided (draft)')
    + '</dl>'
    + note('Verification is what makes asking less defensible',
      '<p>Deciding on a declaration and a confirmation is only safe if we know how often they are wrong. The random sample is the evidence for that, and the reason it can’t be targeted at cases that look risky.</p>'
      + openQ('verification','what sample size? What happens to the licence when a declaration turns out to be wrong? What are drivers told about the check, and when?')
      + '<p><a href="#" onclick="state.caseOutcome.sampledForVerification=!state.caseOutcome.sampledForVerification;route();return false;">Workshop: show the '+(co.sampledForVerification ? 'not picked' : 'picked')+' version</a></p>');
}

Object.assign(RENDER, {
  'case':         { title:'Case view', fn:renderCase, wide:true, staff:true },
  'verification': { title:'Verification', fn:renderVerification, staff:true }
});

/* ---------------------------------------------------------------- */
/* CHROME AND ROUTER                                                 */
/* ---------------------------------------------------------------- */
function renderChrome(inner, screen){
  const staff = screen.staff;
  const name = staff ? STAFF_NAME : SERVICE_NAME;
  const home = staff ? '#/case' : '#/arrival';
  const signOut = (!staff && state.signedIn) ? '<a class="govuk-header__signout" href="#" onclick="signOut();return false;">Sign out</a>' : '';
  return '<header class="govuk-header" role="banner"><div class="govuk-header__container">'
    +'<a href="'+home+'" class="govuk-header__homepage-link">'+LOGO+'</a>'+signOut+'</div></header>'
    +'<div class="service-nav"><div class="service-nav__wrapper">'
    +'<a class="service-nav__name" href="'+home+'">'+esc(name)+'</a></div></div>'
    +'<div class="govuk-phase-banner"><div class="govuk-phase-banner__wrapper">'
    +'<span class="govuk-phase-banner__tag">Prototype</span><span>This is not a real service.</span>'
    +'<span class="phase-actions"><a href="#" onclick="toggleNotes();return false;">'+(state.showNotes?'Hide':'Show')+' design notes</a>'
    +'<a href="#/rules">Rules</a><a href="#/all-screens">All screens</a></span></div></div>'
    +'<div class="govuk-width-container"><main class="govuk-main-wrapper" id="main">'+warn()
    +'<div class="govuk-grid-row"><div class="'+(screen.wide?'govuk-grid-column-full':'govuk-grid-column-two-thirds')+'">'+inner+'</div></div></main></div>';
}

function route(){
  const key = (location.hash || '#/all-screens').replace(/^#\/?/, '') || 'all-screens';
  const [base, param] = key.split('/');
  const screen = RENDER[key] || RENDER[base+'/*'] || RENDER['all-screens'];
  const keyUsed = (RENDER[key] || RENDER[base+'/*']) ? key : 'all-screens';
  if(state.lastKey !== keyUsed){ state.errors = null; state.form = {}; }
  state.lastKey = keyUsed;
  const title = typeof screen.title === 'function' ? screen.title(param) : screen.title;
  document.getElementById('app').innerHTML = renderChrome(screen.fn(param), screen);
  document.title = (state.errors && state.errors.length ? 'Error: ' : '') + title + ' – ' + (screen.staff ? STAFF_NAME : SERVICE_NAME) + ' (prototype)';
  const summary = document.getElementById('error-summary');
  if(summary){ summary.focus(); } else { window.scrollTo(0,0); }
}
resetState(1);
window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', route);
</script>
